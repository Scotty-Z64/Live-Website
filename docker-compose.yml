# TenderSync SA — local/full stack. Production runs the same images on AWS af-south-1
# (RDS PostgreSQL 16 + pgvector, ElastiCache Redis 7, S3 + KMS) — see README §Deployment.
name: tendersync

x-backend-env: &backend-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://tendersync_app:tendersync_app@postgres:5432/tendersync
    REDIS_URL: redis://redis:6379/0
    CLAMAV_HOST: clamav
    CLAMAV_PORT: "3310"
    APP_BASE_URL: http://localhost:8000
    FRONTEND_ORIGIN: http://localhost:3000
    LOCAL_STORAGE_DIR: /data/storage
    PLAYWRIGHT_EXECUTABLE_PATH: ""

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tendersync"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  clamav:
    image: clamav/clamav:1.4
    ports: ["3310:3310"]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      retries: 20
      start_period: 180s

  migrate:
    build: { context: ./backend, additional_contexts: { scripts: ./scripts } }
    <<: *backend-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ./backend, additional_contexts: { scripts: ./scripts } }
    <<: *backend-env
    command: ["sh", "-c", "python /app/scripts/preflight_check.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports: ["8000:8000"]
    volumes: [storage:/data/storage]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      clamav: { condition: service_healthy }

  worker:
    build: { context: ./backend, additional_contexts: { scripts: ./scripts } }
    <<: *backend-env
    command: ["celery", "-A", "app.worker", "worker", "-l", "info", "-Q", "default,ocr,harvest,render,submit", "-c", "4"]
    volumes: [storage:/data/storage]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  beat:
    build: { context: ./backend, additional_contexts: { scripts: ./scripts } }
    <<: *backend-env
    command: ["celery", "-A", "app.worker", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      redis: { condition: service_healthy }

  web:
    build: ./frontend
    environment:
      API_ORIGIN: http://api:8000
      NEXT_PUBLIC_WS_ORIGIN: ws://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  storage:
